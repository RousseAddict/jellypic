# The demo library: what build-seed.py downloads, checks and writes.
#
# Every source is a US National Park Service work on Wikimedia Commons, public
# domain as a work of the US federal government (PD-USGov-NPS); `page` is its
# Commons description page. sha1 is the hash Commons publishes for the original
# file, and a download that does not match it is refused.
#
# Capture dates and coordinates are invented: a year of trips through the parks
# the photos were taken in. `taken` is wall-clock time written to EXIF
# DateTimeOriginal, as a camera does; `created_utc` is a video's creation_time,
# which is UTC, as an iPhone writes it. Coordinates are the Commons ones where
# the file has them, otherwise the park's centre with a fixed per-file offset.

