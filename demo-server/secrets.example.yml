# Copy to secrets.local.yml (gitignored, chmod 600) and fill in.
#
# The admin account can only sign in from the VPS itself, through an ssh tunnel:
#   ssh -L 8096:127.0.0.1:8096 <host>   then open http://localhost:8096
#
# The demo password goes into App Store Connect's review notes and is typed by
# the reviewer on a phone: keep it to lowercase letters. Login lockout is off
# for that account (vars.yml), so its length is what stops guessing.

jellyfin_admin_user: admin
jellyfin_admin_password: ""
jellyfin_demo_password: ""
